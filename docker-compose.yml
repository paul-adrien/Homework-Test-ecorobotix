services:
  postgres:
    image: postgres:16-alpine
    container_name: agriwatch-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agriwatch
      POSTGRES_PASSWORD: agriwatch
      POSTGRES_DB: agriwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriwatch -d agriwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
